services:
  first:
    image: python@sha256:7ce4b6dfe35e55397b7cda544f8a13f191b7ae28dc5aad71fe664dbc9bc2623f
    command: [python, -m, http.server, '8000']
    networks: [first]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000')"]
      interval: 1s
      timeout: 2s
      retries: 30
  second:
    image: python@sha256:7ce4b6dfe35e55397b7cda544f8a13f191b7ae28dc5aad71fe664dbc9bc2623f
    command: [python, -m, http.server, '8000']
    networks: [second]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000')"]
      interval: 1s
      timeout: 2s
      retries: 30
networks:
  first: {}
  second: {}
