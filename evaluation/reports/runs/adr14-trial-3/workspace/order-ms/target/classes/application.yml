spring:
  application:
    name: order-ms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pedidos}
    username: ${DB_USER:pedidos}
    password: ${DB_PASSWORD:pedidos}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        spring.json.add.type.headers: false
    consumer:
      group-id: order-ms
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.prueba.orderms.messaging
        spring.json.value.default.type: com.prueba.orderms.messaging.PaymentProcessedEvent
        spring.json.use.type.headers: false
    listener:
      ack-mode: record
      observation-enabled: true
  jpa:
    hibernate:
      # ddl-auto: validate — init.sql es la unica fuente de verdad del esquema
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

app:
  rsa:
    private-key-path: ${RSA_PRIVATE_KEY_PATH:}
    public-key-path: ${RSA_PUBLIC_KEY_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-sin-correlacion}] %logger{36} - %msg%n"
