spring:
  jpa:
    hibernate:
      # create-drop en tests: no hay init.sql, Hibernate genera el esquema desde las entidades
      ddl-auto: create-drop
  kafka:
    consumer:
      auto-offset-reset: earliest

app:
  rsa:
    private-key-path: ""
    public-key-path: ""

logging:
  level:
    org.apache.kafka: WARN
    org.testcontainers: WARN
